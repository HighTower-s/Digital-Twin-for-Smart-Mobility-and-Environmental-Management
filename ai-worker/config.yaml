# AI Worker — ค่าตั้งค่าสำหรับ prototype (line counting)
# รัน: python -m src.main   (หรือ --config other.yaml เพื่อใช้ไฟล์อื่น)

video: data/input_videos/traffic-5.mp4
model: data/weights/yolov8s.pt
camera_id: cam-chalongkrung-01

imgsz: 1280
conf: 0.35
tracker: bytetrack.yaml        #bytetrack.yaml หรือ botsort.yaml (สลับ ID น้อยกว่า แต่ช้ากว่า)
device: 0                   # auto | cpu | 0

show_window: true
max_frames: 0                 # 0 = ทั้งคลิป
emit_preview: 20             # 0 = print ทุก event ถ้ารถหนาแน่นใช้ตัวเลขจำกัด

send_to_backend: true        # true = POST spawn event เข้า backend แบบ real-time ด้วย
backend_url: http://localhost:3000   # ต้องรัน backend (cd backend && npm run dev) ไว้ก่อน

# zones: auto = เดาโซน/เส้นนับจากขนาดเฟรม (ใช้ดูภาพรวมเร็ว ๆ ตัวเลขยังอ้างอิงไม่ได้)
# หรือใส่ calib เอง เช่น:
# zones:
#   - name: in
#     expectedDirection: toward
#     polygon: [[960, 270], [1843, 270], [1843, 1026], [960, 1026]]
#     line: [[965, 648], [1838, 648]]
#   - name: out
#     expectedDirection: away
#     polygon: [[77, 270], [960, 270], [960, 1026], [77, 1026]]
#     line: [[82, 648], [955, 648]]
zones:
  - name: in
    expectedDirection: toward
    polygon: [[2181, 1575], [3300, 1551], [2625, 1038], [2052, 1053]]
    line: [[2109, 1272], [2967, 1287]]
  - name: out
    expectedDirection: away
    polygon: [[1818, 1524], [1863, 981], [1353, 954], [723, 1485]]
    line: [[1197, 1077], [1848, 1080]]

