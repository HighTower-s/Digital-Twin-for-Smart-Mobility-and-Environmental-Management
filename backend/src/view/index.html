<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Flow — Live Monitor</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    header h1 { font-size: 1.4rem; font-weight: 600; }

    #status-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #f85149;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    #status-dot.connected { background: #3fb950; }

    #status-label {
      font-size: 0.85rem;
      color: #8b949e;
    }

    h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    section { margin-bottom: 32px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 16px;
    }

    .card .label {
      font-size: 0.75rem;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .card .value {
      font-size: 1.6rem;
      font-weight: 700;
      color: #58a6ff;
    }

    .card .sub {
      font-size: 0.8rem;
      color: #8b949e;
      margin-top: 4px;
      word-break: break-all;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    thead th {
      text-align: left;
      padding: 8px 12px;
      background: #161b22;
      color: #8b949e;
      font-weight: 600;
      border-bottom: 1px solid #30363d;
    }

    tbody tr { border-bottom: 1px solid #21262d; }
    tbody tr:last-child { border-bottom: none; }

    tbody td {
      padding: 8px 12px;
      color: #e6edf3;
    }

    .table-wrap {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge.car        { background: #1f6feb; color: #fff; }
    .badge.truck      { background: #bb800a; color: #fff; }
    .badge.motorcycle { background: #238636; color: #fff; }
    .badge.bus        { background: #8957e5; color: #fff; }

    .direction {
      font-size: 0.75rem;
      color: #8b949e;
    }

    #empty-state {
      text-align: center;
      padding: 40px;
      color: #8b949e;
      font-size: 0.9rem;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
    }

    .feed-item {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
    }

    .feed-item-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 0.8rem;
      color: #8b949e;
      flex-wrap: wrap;
    }

    .feed-item-head .time { color: #e6edf3; }
    .feed-item-head .track-id { font-family: monospace; }

    pre {
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.8rem;
      color: #c9d1d9;
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 10px 12px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .flash { animation: flash 0.5s ease; }
    @keyframes flash {
      0%   { background: #1f3a5f; }
      100% { background: #161b22; }
    }
  </style>
</head>
<body>

<header>
  <div id="status-dot"></div>
  <h1>Smart Flow — Live Monitor</h1>
  <span id="status-label">connecting…</span>
</header>

<section id="summary">
  <h2>Summary Report</h2>
  <div class="cards">
    <div class="card">
      <div class="label">Total</div>
      <div class="value" id="stat-all">—</div>
      <div class="sub">vehicles counted</div>
    </div>
    <div class="card">
      <div class="label">In</div>
      <div class="value" id="stat-in">—</div>
    </div>
    <div class="card">
      <div class="label">Out</div>
      <div class="value" id="stat-out">—</div>
    </div>
    <div class="card">
      <div class="label">Camera</div>
      <div class="value" style="font-size:1rem; padding-top:6px;" id="stat-camera">—</div>
      <div class="sub" id="stat-since">since —</div>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Type</th><th>In</th><th>Out</th><th>Total</th></tr>
      </thead>
      <tbody id="stat-by-type">
        <tr><td><span class="badge car">car</span></td><td id="stat-car-in">—</td><td id="stat-car-out">—</td><td id="stat-car-total">—</td></tr>
        <tr><td><span class="badge truck">truck</span></td><td id="stat-truck-in">—</td><td id="stat-truck-out">—</td><td id="stat-truck-total">—</td></tr>
        <tr><td><span class="badge motorcycle">motorcycle</span></td><td id="stat-motorcycle-in">—</td><td id="stat-motorcycle-out">—</td><td id="stat-motorcycle-total">—</td></tr>
        <tr><td><span class="badge bus">bus</span></td><td id="stat-bus-in">—</td><td id="stat-bus-out">—</td><td id="stat-bus-total">—</td></tr>
      </tbody>
    </table>
  </div>
</section>

<section id="feed-section">
  <h2>Payload Feed</h2>
  <div id="empty-state">Waiting for spawn events…</div>
  <div id="feed-list"></div>
</section>

<script>
  const MAX_FEED_ITEMS = 50;
  const VEHICLE_TYPES = ['car', 'truck', 'motorcycle', 'bus'];

  const socket = io();

  const statusDot   = document.getElementById('status-dot');
  const statusLabel = document.getElementById('status-label');
  const emptyState  = document.getElementById('empty-state');
  const feedList    = document.getElementById('feed-list');

  socket.on('connect', () => {
    statusDot.classList.add('connected');
    statusLabel.textContent = 'connected';
  });

  socket.on('disconnect', () => {
    statusDot.classList.remove('connected');
    statusLabel.textContent = 'disconnected — retrying…';
  });

  socket.on('spawn', (event) => {
    addFeedItem(event);
    fetchStats();
  });

  function addFeedItem(event) {
    emptyState.style.display = 'none';

    const item = document.createElement('div');
    item.className = 'feed-item flash';

    const time = event.timestamp ? new Date(event.timestamp).toLocaleTimeString() : '—';
    const confidence = typeof event.confidence === 'number' ? event.confidence.toFixed(2) : '—';

    item.innerHTML = `
      <div class="feed-item-head">
        <span class="time">${time}</span>
        <span class="badge ${event.type}">${event.type}</span>
        <span class="direction">${event.direction}</span>
        <span class="track-id">${event.trackId}</span>
        <span>conf ${confidence}</span>
      </div>
      <pre></pre>
    `;
    item.querySelector('pre').textContent = JSON.stringify(event, null, 2);

    feedList.prepend(item);
    while (feedList.childElementCount > MAX_FEED_ITEMS) {
      feedList.removeChild(feedList.lastElementChild);
    }
  }

  function renderStats(stats) {
    document.getElementById('stat-all').textContent = stats.totals.all;
    document.getElementById('stat-in').textContent = stats.totals.in;
    document.getElementById('stat-out').textContent = stats.totals.out;
    document.getElementById('stat-camera').textContent = stats.cameraId || '—';
    document.getElementById('stat-since').textContent = stats.since
      ? `since ${new Date(stats.since).toLocaleTimeString()}`
      : 'since —';

    for (const type of VEHICLE_TYPES) {
      const counts = stats.byType[type] ?? { in: 0, out: 0 };
      document.getElementById(`stat-${type}-in`).textContent = counts.in;
      document.getElementById(`stat-${type}-out`).textContent = counts.out;
      document.getElementById(`stat-${type}-total`).textContent = counts.in + counts.out;
    }
  }

  function fetchStats() {
    fetch('/api/stats')
      .then((res) => res.json())
      .then(renderStats)
      .catch((err) => console.error('[dashboard] fetch /api/stats failed:', err));
  }

  fetchStats();
</script>

</body>
</html>
